<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Search App</title>

    <!-- MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="search-box">
            <input type="text" id="place" placeholder="Enter City or Country">
            <button onclick="searchLocation()">Search</button>
        </div>

        <div id="map"></div>
    </div>

    <!-- MapLibre JS -->
    <script src="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
