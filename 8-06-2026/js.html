<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
  <h1>This is Signals</h1>
  <script>
    let signals="red";
    switch(signals){
    case "red":
      console.log("Stop Immediately");
      break;
    case "yellow":
      console.log(" Slow down and prepare to stop");
      break;
    case "Green":
      console.log("Go Safely");
      break;
    default:
      console.log("Invalid");
      break;
    }
  </script>
</body>
