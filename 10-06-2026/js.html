<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Arrays</h1>

  <script>

    // movies

    const movies = [
  { id: 1, title: "Bahubali", rating: 9 },
  { id: 2, title: "Pushpa", rating: 8 },
  { id: 3, title: "RRR", rating: 10 },
  { id: 4, title: "Salaar", rating: 7 }
];

let titles=movies.map(mtitles => mtitles.title);
console.log(titles);

let ratings=movies.map(mratings => mratings.rating);
console.log(ratings);

let updateRating=movies.map(upratings => upratings.rating+1);
console.log(updateRating);

let gratings=movies.filter(grratings => grratings.rating > 8);
console.log(gratings);

let grating=movies.filter(grratings => grratings.rating < 9);
console.log(grating);

let mid=movies.find(mids=>mids.id===3);
console.log(mid);

let ftitle=movies.find(ftitles=>ftitles.title==="Pushpa");
console.log(ftitle);

let rratings=movies.reduce((sum,rrate) => sum+rrate.rating,0);
console.log(rratings);


let uptitle=movies.map(ftitles=>ftitles.title.toUpperCase());
console.log(uptitle);

let lentitle=movies.filter(ftitles=>ftitles.title.length>5);
console.log(lentitle);

let highestRating=movies[0];
for(let j=0;j<movies.length;j++){
  if(movies[j].rating>highestRating.rating){
    highestRating=movies[j];
  }
}
console.log(highestRating);

// products

const products = [
  { id: 1, name: "Laptop", price: 50000 },
  { id: 2, name: "Mouse", price: 500 },
  { id: 3, name: "Keyboard", price: 1500 },
  { id: 4, name: "Monitor", price: 12000 }
];

let nameProduct=products.map(npr=>npr.name);
console.log(nameProduct);

let priceProduct=products.map(npr=>npr.price);
console.log(priceProduct);

let inpriceProduct=products.map(npr=>npr.price+1000);
console.log(inpriceProduct);

let gpriceProduct=products.filter(npr=>npr.price>1000);
console.log(gpriceProduct);

let lpriceProduct=products.filter(npr=>npr.price<10000);
console.log(lpriceProduct);

let ipriceProduct=products.find(npr=>npr.id===2);
console.log(ipriceProduct);

let npriceProduct=products.find(npr=>npr.name==="Monitor");
console.log(npriceProduct);

let ppriceProduct=products.reduce((sum,npr)=>sum+npr.price,0);
console.log(ppriceProduct);

let lnameProduct=products.map(npr=>npr.name.toLowerCase());
console.log(lnameProduct);

let ep=products[0];
for(let expensiveProduct of products){
  if(expensiveProduct.price>ep.price)
  ep=expensiveProduct;
}
console.log(ep);

// cricket scores

const scores = [45, 80, 20, 100, 60];

let score=scores.map(cscore=>cscore+10);
console.log(score);

let lscore=scores.map(cscore=>cscore+5);
console.log(lscore);

let gscore=scores.filter(cscore=>cscore>50);
console.log(gscore);

let grscore=scores.filter(cscore=>cscore>=80);
console.log(grscore);

let grescore=scores.find(cscore=>cscore>70);
console.log(grescore);

let greascore=scores.find(cscore=>cscore===100);
console.log(greascore);


let greatscore=scores.reduce((sum,cscore)=>sum+cscore,0);
console.log(greatscore);

let avgscore=scores.reduce((sum,cscore)=>sum+cscore,0);
let averagescore=avgscore/scores.length;
console.log(averagescore);

let highestScore=scores[0];
for(let j=0;j<scores.length;j++){
  if(scores[j]>highestScore){
    highestScore=scores[j];
  }
}
console.log(highestScore);

// students

const students = [
  { name: "Ravi", marks: 90 },
  { name: "Priya", marks: 75 },
  { name: "Rahul", marks: 40 },
  { name: "Anu", marks: 95 }
];

let snames=students.map(sname=>sname.name);
console.log(snames);

let smarks=students.map(sname=>sname.marks);
console.log(smarks);

let amarks=students.map(sname=>sname.marks+5);
console.log(amarks);

let gmarks=students.find(sname=>sname.marks>80);
console.log(gmarks);

let lmarks=students.find(sname=>sname.marks<50);
console.log(lmarks);

let nmarks=students.find(sname=>sname.name==="Rahul");
console.log(nmarks);

let grmarks=students.find(sname=>sname.marks>90);
console.log(grmarks);

let tmarks=students.reduce((sum,sname)=>sum+sname.marks,0);
console.log(tmarks);

let stmarks=students.find(sname=>sname.name.startsWith("R"));
console.log(stmarks);

let highestMarks=students[0];
for(let j=0;j<students.length;j++){
  if(students[j].marks>highestMarks){
    highestMarks=students.marks[j];
  }
}
console.log(highestMarks.name + " ->" + highestMarks.marks);

// both cricket scores and marks

let combined=tmarks+greatscore;
console.log(combined);

// Food Orders

const foodOrders = [
  { item: "Pizza", price: 300 },
  { item: "Burger", price: 150 },
  { item: "Biryani", price: 250 },
  { item: "Ice Cream", price: 100 }
];

let foodItem=foodOrders.map(foodItems=>foodItems.item);
console.log(foodItem);

let foodPrices=foodOrders.map(foodItems=>foodItems.price);
console.log(foodPrices);


let infoodPrices=foodOrders.map(foodItems=>foodItems.price+50);
console.log(infoodPrices);

let orfoodPrices=foodOrders.filter(foodItems=>foodItems.price>200);
console.log(orfoodPrices);

let lfoodPrices=foodOrders.filter(foodItems=>foodItems.price<250);
console.log(lfoodPrices);

let ffoodPrices=foodOrders.find(foodItems=>foodItems.item==="Biryani");
console.log(ffoodPrices);

let pfoodPrices=foodOrders.find(foodItems=>foodItems.price>250);
console.log(pfoodPrices);

let tfoodPrices=foodOrders.reduce((sum,foodItems)=>sum+foodItems.price,0);
console.log(tfoodPrices);

  </script>

</body>
</html>
