<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Welcome Screen -->
      <div id="welcome-screen">
        <h1>JavaScript Quiz</h1>
        <p>Test your JavaScript knowledge with 10 questions</p>

        <div class="info-box">
          <div class="card">10 Questions</div>
          <div class="card">Multiple Choice</div>
          <div class="card">Test Knowledge</div>
        </div>

        <button id="start-btn">Start Quiz</button>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen" class="hide">
        <h3 id="progress"></h3>

        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-box">
          <h2 id="question"></h2>
          <div id="options"></div>
        </div>

        <div class="buttons">
          <button id="prev-btn">Previous</button>
          <button id="next-btn">Next</button>
          <button id="submit-btn" class="hide">Submit Quiz</button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hide">
        <h1>Quiz Completed!</h1>

        <div class="circle-score">
          <h2 id="percentage"></h2>
        </div>

        <div class="result-box">
          <div class="result-card">
            <p id="correct"></p>
          </div>

          <div class="result-card">
            <p id="wrong"></p>
          </div>

          <div class="result-card">
            <p id="score"></p>
          </div>
        </div>

        <h3 id="message"></h3>

        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
